name: Actualizar directo de YouTube

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detectar el directo activo
        run: python update_live.py

      - name: Publicar el cambio si hay un directo nuevo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar ID del directo de YouTube"
            git push
          else
            echo "Sin cambios: no hay directo nuevo."
          fi
